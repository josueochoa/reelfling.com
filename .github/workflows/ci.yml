name: CI

# Checks only. Do not upload a Workers version from here: preview_urls and
# workers_dev are false because those hostnames bypass Cloudflare Access on
# reelfling.com, and this app only accepts the production Access audience.
on:
  pull_request:

# Checkout and the local npm toolchain only.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Test, typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # No engines field or .nvmrc. Next.js requires Node >=20.9 and Wrangler >=22.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
